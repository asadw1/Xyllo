# Xyllo configuration for the docker-compose environment.
# Mounted at /config/config.yaml inside the xyllo and simulator containers.
# Redis is enabled and points to the compose service name.

dispatcher:
  workers: 8
  buffer_size: 4096

batcher:
  max_size: 500
  flush_interval: 2s

dlq:
  backend: file
  target: /tmp/xyllo-dlq.log

observability:
  metrics_path: /metrics
  metrics_port: "9091"

tls:
  enabled: false
  cert_file: ""
  key_file: ""

auth:
  mode: none
  api_key: ""
  jwt_secret: ""
  jwt_issuer: ""

rate_limit:
  enabled: true
  requests_per_second: 1000
  burst_size: 2000

redis:
  enabled: true
  addr: "redis:6379"
  password: ""
  db: 0
  stream_prefix: "xyllo:stream"
  consumer_group: "xyllo-consumers"
  consumer_name: "xyllo-1"
  regions:
    - us-east-1
    - eu-west-1
    - ap-southeast-1
    - sa-east-1
    - af-south-1
  read_batch_size: 100
  read_block_ms: 1000
